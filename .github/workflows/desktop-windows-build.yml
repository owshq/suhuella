name: Desktop Windows Build

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Branch or tag to build
        required: false
        default: main

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      SUHUELLA_DESKTOP_CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref || 'main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install brands + desktop
        shell: pwsh
        run: |
          npm install --prefix brands
          npm install --prefix desktop --ignore-scripts
          npm install --prefix site --ignore-scripts

      - name: Prepare brand entry
        run: |
          node brands/project-brand.mjs
          node brands/project-site.mjs

      - name: Health (build coherence)
        run: npm run health:ci

      - name: Read release version
        id: release
        shell: pwsh
        run: |
          $manifest = Get-Content brands/suhuella/release.json | ConvertFrom-Json
          "version=$($manifest.version)" >> $env:GITHUB_OUTPUT
          "win_name=SuHuella-Setup-$($manifest.version).exe" >> $env:GITHUB_OUTPUT
          "tag=v$($manifest.version)" >> $env:GITHUB_OUTPUT

      - name: Build Windows installer
        run: npm run package:win --prefix desktop

      - name: Locate installer
        id: installer
        shell: pwsh
        run: |
          $patterns = @(
            "desktop/.build/suhuella/release/SuHuella-Setup-*.exe",
            "desktop/release/SuHuella Setup *.exe",
            "desktop/release/SuHuella-Setup-*.exe"
          )
          $exe = $null
          foreach ($p in $patterns) {
            $dir = Split-Path $p -Parent
            $filter = Split-Path $p -Leaf
            if (Test-Path $dir) {
              $found = Get-ChildItem -Path $dir -Filter $filter -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { $exe = $found; break }
            }
          }
          if (-not $exe) { throw "Installer not found under desktop/" }
          $dest = Join-Path $env:RUNNER_TEMP "${{ steps.release.outputs.win_name }}"
          Copy-Item $exe.FullName $dest
          "path=$dest" >> $env:GITHUB_OUTPUT

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuHuella-Setup-windows
          path: ${{ steps.installer.outputs.path }}
          retention-days: 14

      - name: Write SHA256 sidecar
        id: sha
        shell: pwsh
        run: |
          $hash = (Get-FileHash "${{ steps.installer.outputs.path }}" -Algorithm SHA256).Hash.ToLower()
          $sidecar = Join-Path $env:RUNNER_TEMP "${{ steps.release.outputs.win_name }}.sha256"
          Set-Content -Path $sidecar -Value "$hash  ${{ steps.release.outputs.win_name }}"
          "path=$sidecar" >> $env:GITHUB_OUTPUT
          "digest=$hash" >> $env:GITHUB_OUTPUT

      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release upload "${{ steps.release.outputs.tag }}" "${{ steps.installer.outputs.path }}" --clobber
          gh release upload "${{ steps.release.outputs.tag }}" "${{ steps.sha.outputs.path }}" --clobber
